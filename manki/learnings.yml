- id: learn-1793975085511
  content: 'User context on "src/judge.ts": Fixed in 5f62189. The rule now covers
    only a value the code produces and keeps valid. When code in the PR can
    produce a bad value, the guard is not the finding, and the judge grades the
    failure that bad value causes by the table, so memory unsafety still blocks.
    A new grading fixture (`11_severe_on_internal_value.json`) has an internally
    computed index writing past a buffer in `unsafe` Rust. The live replay
    grades it `blocker`, and the other ten fixtures still pass.'
  scope: repo
  source: manki-review/manki#1040
  created_at: 2026-11-06
- id: learn-1793975141867
  content: 'User context on "src/judge.ts": Keeping this as is. The effect only
    reaches PRs that are open when v7 is installed, and only until their code at
    the flagged spot changes. The judge cannot see which rubric graded a prior
    round: the prior round findings it receives carry no version. Treating a
    rubric change as new evidence would need that version passed through to the
    judge, and it would also unanchor every grade on those PRs, which is the
    flip-flop the stability rule prevents. Once the PRs open at the upgrade
    merge, every grade'
  scope: repo
  source: manki-review/manki#1040
  created_at: 2026-11-06
