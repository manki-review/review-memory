- id: learn-1795217831756
  content: 'Findings like "The public filter request key changes type and
    conflates different ranges" do not apply on
    `dash-spv/src/network/broker.rs`: Marked the PR as breaking
    (`fix(dash-spv)!:`), since `RequestKey` is public. Distinct ranges cannot
    share a stop hash here: batch boundaries are fixed, so no two `getcfilters`
    end at the same block, and `CfHeaders` was already keyed by its stop hash.'
  scope: repo
  path: dash-spv/src/network/broker.rs
  source: dashpay/rust-dashcore#1370
  created_at: 2026-11-20
- id: learn-1795309543095
  content: 'Findings like "The fixed two-second target keeps high-latency peers at
    the floor" do not apply on `dash-spv/src/network/manager.rs`: This is
    intended. `TARGET_QUEUE_SECS` bounds how long a request waits behind the
    ones before it. A cap that grows with the round trip would bring back the
    multi-second queues this PR removes. A peer whose round trip under load
    passes 2 s still works, at about `MIN_CAP_BYTES` per round trip. Admissio'
  scope: repo
  path: dash-spv/src/network/manager.rs
  source: dashpay/rust-dashcore#1371
  created_at: 2026-11-22
- id: learn-1795355422672
  content: "Findings like \"A ban recorded during DNS discovery can be cleared by
    the next handshake\" do not apply on `dash-spv/src/network/manager.rs`: This
    window can't be reached. DNS runs only once per manager: `discovered` is
    resolved on the first `get` and kept, and that first `get` is the
    supervisor's first round, before any peer is connected. `ban_peer` is only
    called for something a connected peer did, so no ban can land on a
    discovered add"
  scope: repo
  path: dash-spv/src/network/manager.rs
  source: dashpay/rust-dashcore#1482
  created_at: 2026-11-22
