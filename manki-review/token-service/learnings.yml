- id: learn-1795449987691
  content: "Findings like \"Repos with `auto_review: false` get a stray Manki
    check on a push while GitHub computes mergeability\" do not apply on
    `src/coordinator.ts`: This is the known trade-off of showing the check while
    a push review is queued, and it was accepted for this PR. Before the PR
    reads `.manki.yml`, the Worker can't know that `auto_review` is off, so a
    queued push review on such a repository can show a \"Queued\" check. The
    retry after the mergeability"
  scope: repo
  path: src/coordinator.ts
  source: manki-review/token-service#141
  created_at: 2026-11-23
- id: learn-1795452945995
  content: "Findings like \"Coordinator falls back to the default branch's
    `.manki.yml`, but Manki reads only the base branch's\" do not apply on
    `src/coordinator.ts`: Manki does the same fallback since
    manki-review/manki#2009 (ships in 7.7.6), in `loadConfigAt`. This service
    deploys after 7.7.6 is published."
  scope: repo
  path: src/coordinator.ts
  source: manki-review/token-service#142
  created_at: 2026-11-23
- id: learn-1795578569435
  content: "Findings like \"Draft notice writes an `auto` box that Manki's
    settings block does not know, so Manki drops it on its next rewrite\" do not
    apply on `src/coordinator.ts`: Manki knows the box now:
    manki-review/manki#2065 is merged to `main` as 0ea9e9359 and adds `auto`
    with the label \"Review every push\" to `SettingsBox`, `BOX_LABELS` and
    `SETTINGS_BOXES` in `src/settings.ts`, after `draft`, so the Action parses
    the box and writes it again. A repository on v7.7.5 loses"
